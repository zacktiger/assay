[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    functional: happy-path behaviour of an endpoint
    boundary: boundary-value and equivalence-partition cases
    negative: malformed / hostile input
    security: authn, authz and injection
    schema: response contract and field types
    integrity: API-vs-database consistency checks
    llm: LLM behaviour and evaluation (deterministic stub provider)
    deployment: probes, headers, paging, env gating and schema bootstrap
    slow: excluded from the fast feedback loop
