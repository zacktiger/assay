# Render blueprint - free tier, Docker, one worker.
#
# This is the demo deployment: it exists so the API under test is reachable at
# a URL, not to serve real money. The differences from docs/DEPLOY.md are
# deliberate and listed there under "Free-tier deploy".
services:
  - type: web
    name: assay-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    # One token per word and no quotes: Render re-parses this string, and an
    # inline `sh -c "..."` arrives at the shell with its double quotes intact,
    # which makes the whole pipeline a single command name (exit 127). The
    # ordering - init_db, then uvicorn - lives in the script.
    dockerCommand: sh /srv/app/scripts/start.sh
    # /health deliberately does not touch the database - correct for liveness.
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      # Production default is off. On for the demo: the OpenAPI page is the
      # thing a reviewer actually clicks, and every bound it publishes is
      # already documented in the README.
      - key: ENABLE_DOCS
        value: "true"
      # The in-process login throttle caps this at 1 - see docs/DEPLOY.md.
      - key: WEB_CONCURRENCY
        value: "1"
      # Deterministic offline provider. No API key, no spend, no rate limit.
      - key: LLM_PROVIDER
        value: stub
      - key: DATABASE_URL
        fromDatabase:
          name: assay-db
          property: connectionString

databases:
  - name: assay-db
    plan: free
    region: oregon
    databaseName: qa_finance
    user: qa
